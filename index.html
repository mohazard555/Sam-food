      .form-input, .form-textarea, .form-select {

      }
      .btn {
        @apply px-4 py-2 rounded-md font-semibold text-white transition-transform transform hover:scale-105 shadow hover:shadow-lg;
      }
      .btn-primary {
        @apply bg-purple-600 hover:bg-purple-700;
      }
      .btn-secondary {
        @apply bg-pink-500 hover:bg-pink-600;
      }
      .btn-danger {
        @apply bg-red-500 hover:bg-red-600;
      }
      .card {
        @apply bg-white rounded-lg shadow-md overflow-hidden transition-shadow hover:shadow-xl;
      }
       @media print {
        body * {
          visibility: hidden;
        }
        .printable-area, .printable-area * {
          visibility: visible;
        }
        .printable-area {
          position: absolute;
          left: 0;
          top: 0;
          width: 100%;
          margin: 0;
          padding: 2rem;
          border: none;
          box-shadow: none;
        }
        .no-print, .no-print * {
          display: none !important;
        }
